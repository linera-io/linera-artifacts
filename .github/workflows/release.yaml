name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "SemVer tag to publish (e.g. v0.13.0). Must already exist as a git tag."
        required: true

permissions:
  contents: read
  packages: write
  id-token: write   # cosign keyless signing

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  publish-charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: >-
            ${{ github.event_name == 'workflow_dispatch'
                && github.event.inputs.tag
                || github.ref_name }}

      - name: derive chart version (strip leading "v")
        id: version
        env:
          REF_INPUT: >-
            ${{ github.event_name == 'workflow_dispatch'
                && github.event.inputs.tag
                || github.ref_name }}
        run: |
          tag="${REF_INPUT}"
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing chart version ${version} from tag ${tag}"

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      # Single docker login that writes credentials to ~/.docker/config.json.
      # All three OCI clients used below (helm push, oras push, cosign sign)
      # read from that file, so a single login covers all of them. Helm's
      # own `helm registry login` writes to a different config path that
      # cosign does NOT read, which is why the standalone helm login below
      # was leaving cosign sign on a 401 against the same registry it had
      # just pushed to.
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: v2.4.1

      - uses: oras-project/setup-oras@v1
        with:
          version: 1.2.0

      - name: package + push every chart, then sign
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          mkdir -p .release
          target="oci://${REGISTRY}/${IMAGE_NAMESPACE}/charts"
          for chart in helm/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            name=$(basename "$chart")
            echo "::group::$name"

            # Pull subcharts only when this chart has dependencies. The
            # umbrella references its sibling charts via file:// during
            # development; for release we publish each chart in turn so
            # the umbrella resolves against the OCI registry for
            # downstream users.
            if grep -q '^dependencies:' "$chart/Chart.yaml"; then
              helm dependency build "$chart"
            fi

            helm package "$chart" \
              --version "$VERSION" \
              --destination .release

            tgz=".release/${name}-${VERSION}.tgz"
            push_output=$(helm push "$tgz" "$target" 2>&1)
            echo "$push_output"
            digest=$(echo "$push_output" | awk '/Digest:/ {print $2}')
            ref="${target#oci://}/${name}:${VERSION}"
            echo "Signing ${ref}@${digest}"
            cosign sign --yes "${ref}@${digest}"

            # Publish the per-chart artifacthub-repo.yml as an OCI
            # artifact under the reserved `:artifacthub.io` tag. Each
            # chart on Artifact Hub is a separate repository with its
            # own UUID, so the claim file lives next to the chart
            # (helm/<chart>/artifacthub-repo.yml) rather than at repo
            # root. Artifact Hub scrapes this tag per-chart to discover
            # and verify repository ownership.
            # Ref: https://artifacthub.io/docs/topics/repositories/helm-charts/
            oras push \
              "${ref%:*}:artifacthub.io" \
              --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
              "${chart}artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"
            echo "::endgroup::"
          done

  # Publishing charts is not the same as announcing a release: until now a tag
  # produced OCI artifacts and nothing an operator could read. This turns the
  # tag's CHANGELOG section into the GitHub Release body, so "what changed"
  # lives at the URL people actually open.
  github-release:
    needs: publish-charts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: >-
            ${{ github.event_name == 'workflow_dispatch'
                && github.event.inputs.tag
                || github.ref_name }}

      - name: extract this version's CHANGELOG section
        env:
          TAG: >-
            ${{ github.event_name == 'workflow_dispatch'
                && github.event.inputs.tag
                || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Everything between this version's heading and the next one. An
          # empty result fails the job: a release whose notes silently came
          # out blank is worse than no release job at all.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found && /^\[[^]]+\]: / { exit }   # the link-reference block
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${version}." >&2
            echo "::error::Add '## [${version}] — <date>' before tagging." >&2
            exit 1
          fi
          echo "::group::release notes"
          cat notes.md
          echo "::endgroup::"

      - name: create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: >-
            ${{ github.event_name == 'workflow_dispatch'
                && github.event.inputs.tag
                || github.ref_name }}
        run: |
          set -euo pipefail
          # Idempotent: a re-run of workflow_dispatch updates the notes rather
          # than failing on an existing release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi
