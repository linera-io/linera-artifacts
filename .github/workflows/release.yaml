name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "SemVer tag to publish (e.g. v0.13.0). Must already exist as a git tag."
        required: true

permissions:
  contents: read
  packages: write
  id-token: write   # cosign keyless signing

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  publish-charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: >-
            ${{ github.event_name == 'workflow_dispatch'
                && github.event.inputs.tag
                || github.ref_name }}

      - name: derive chart version (strip leading "v")
        id: version
        env:
          REF_INPUT: >-
            ${{ github.event_name == 'workflow_dispatch'
                && github.event.inputs.tag
                || github.ref_name }}
        run: |
          tag="${REF_INPUT}"
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing chart version ${version} from tag ${tag}"

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: helm registry login
        env:
          PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$PASSWORD" | helm registry login "$REGISTRY" \
            --username "${{ github.actor }}" \
            --password-stdin

      - uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: v2.4.1

      - uses: oras-project/setup-oras@v1
        with:
          version: 1.2.0

      - name: package + push every chart, then sign
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          mkdir -p .release
          target="oci://${REGISTRY}/${IMAGE_NAMESPACE}/charts"
          for chart in helm/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            name=$(basename "$chart")
            echo "::group::$name"

            # Pull subcharts only when this chart has dependencies. The
            # umbrella references its sibling charts via file:// during
            # development; for release we publish each chart in turn so
            # the umbrella resolves against the OCI registry for
            # downstream users.
            if grep -q '^dependencies:' "$chart/Chart.yaml"; then
              helm dependency build "$chart"
            fi

            helm package "$chart" \
              --version "$VERSION" \
              --destination .release

            tgz=".release/${name}-${VERSION}.tgz"
            push_output=$(helm push "$tgz" "$target" 2>&1)
            echo "$push_output"
            digest=$(echo "$push_output" | awk '/Digest:/ {print $2}')
            ref="${target#oci://}/${name}:${VERSION}"
            echo "Signing ${ref}@${digest}"
            cosign sign --yes "${ref}@${digest}"

            # Publish the per-chart artifacthub-repo.yml as an OCI
            # artifact under the reserved `:artifacthub.io` tag. Each
            # chart on Artifact Hub is a separate repository with its
            # own UUID, so the claim file lives next to the chart
            # (helm/<chart>/artifacthub-repo.yml) rather than at repo
            # root. Artifact Hub scrapes this tag per-chart to discover
            # and verify repository ownership.
            # Ref: https://artifacthub.io/docs/topics/repositories/helm-charts/
            oras push \
              "${ref%:*}:artifacthub.io" \
              --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
              "${chart}artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"
            echo "::endgroup::"
          done
