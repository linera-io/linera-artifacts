extends: default

rules:
  line-length:
    max: 120
  comments:
    min-spaces-from-content: 1
  document-start: disable
  indentation:
    spaces: 2
  truthy:
    allowed-values: ["true", "false", "yes", "no", "on", "off"]
  braces:
    max-spaces-inside: 2
    min-spaces-inside: 0

ignore: |
  # Alloy config files use River (HCL-like) syntax, not YAML.
  *.river

  # Helm chart templates contain Go template syntax ({{ }})
  helm/*/templates/

  # Helm chart README files (generated by helm-docs)
  helm/*/README.md

  # Helm dependency output (gitignored, can leak in locally)
  helm/*/charts/
  helm/*/Chart.lock

  # DevSpace per-user cache (gitignored)
  .devspace/
