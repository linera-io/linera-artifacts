suite: serviceaccount
templates:
  - serviceaccount.yaml
release:
  name: rel
tests:
  - it: creates a ServiceAccount by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: rel-linera-validator

  - it: skips ServiceAccount when serviceAccount.create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: respects custom serviceAccount.name
    set:
      serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: applies serviceAccount.annotations
    set:
      serviceAccount.annotations:
        iam.gke.io/gcp-service-account: validator@project.iam.gserviceaccount.com
    asserts:
      - equal:
          path: metadata.annotations["iam.gke.io/gcp-service-account"]
          value: validator@project.iam.gserviceaccount.com
