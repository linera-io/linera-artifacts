suite: component prefix toggle
templates:
  - proxy.yaml
  - shards.yaml
release:
  name: rel
set:
  validatorImage.repository: us-docker.pkg.dev/linera-io-dev/linera-public-registry/linera
  validatorImage.tag: testnet_conway_release
tests:
  - it: default (useComponentPrefix false) renders clean component names
    asserts:
      - template: proxy.yaml
        documentIndex: 0
        equal:
          path: metadata.name
          value: proxy-internal
      - template: proxy.yaml
        documentIndex: 1
        equal:
          path: metadata.name
          value: proxy
      - template: shards.yaml
        documentIndex: 0
        equal:
          path: metadata.name
          value: shards

  - it: useComponentPrefix true renders legacy fullname-prefixed names (OVH k8s-validator)
    set:
      useComponentPrefix: true
    asserts:
      - template: proxy.yaml
        documentIndex: 0
        equal:
          path: metadata.name
          value: rel-linera-validator-proxy-internal
      - template: proxy.yaml
        documentIndex: 1
        equal:
          path: metadata.name
          value: rel-linera-validator-proxy
      - template: shards.yaml
        documentIndex: 0
        equal:
          path: metadata.name
          value: rel-linera-validator-shards

  - it: useComponentPrefix true with fullnameOverride matches the live OVH names
    set:
      useComponentPrefix: true
      fullnameOverride: validator
    asserts:
      - template: proxy.yaml
        documentIndex: 0
        equal:
          path: metadata.name
          value: validator-proxy-internal
      - template: proxy.yaml
        documentIndex: 1
        equal:
          path: metadata.name
          value: validator-proxy
      - template: shards.yaml
        documentIndex: 0
        equal:
          path: metadata.name
          value: validator-shards
