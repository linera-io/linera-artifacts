suite: secret-config
templates:
  - secret-config.yaml
release:
  name: my-release
tests:
  - it: renders a Secret when no existingSecret is set
    set:
      validator.serverConfigData: '{"key":"signing-key"}'
      validator.genesisConfigData: '{"committee":"public"}'
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: my-release-linera-validator-config
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData.serverConfig
          value: '{"key":"signing-key"}'
      - equal:
          path: stringData.genesisConfig
          value: '{"committee":"public"}'

  - it: skips Secret rendering when existingSecret is set
    set:
      validator.existingSecret: my-external-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: defaults to empty JSON object when config data is omitted
    asserts:
      - equal:
          path: stringData.serverConfig
          value: "{}"
      - equal:
          path: stringData.genesisConfig
          value: "{}"
