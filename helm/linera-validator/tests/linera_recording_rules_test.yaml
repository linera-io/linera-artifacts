suite: linera-recording-rules
templates:
  - linera-recording-rules.yaml
release:
  name: rel
tests:
  - it: renders nothing by default (opt-in)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when only alerts are enabled
    set:
      prometheusRule.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders recording rules when both flags are enabled
    set:
      prometheusRule.enabled: true
      prometheusRule.recordingRules.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PrometheusRule
      - equal:
          path: metadata.name
          value: rel-linera-validator-recording
      - isNotEmpty:
          path: spec.groups
