{{- if .Values.prometheusRule.enabled -}}
{{- $ns := .Release.Namespace -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "linera-validator.fullname" . }}
  labels:
    {{- include "linera-validator.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: linera-validator
      interval: 30s
      rules:
        - alert: LineraValidatorDown
          expr: up{job=~".*linera-validator.*"} == 0
          for: 2m
          labels:
            severity: critical
            component: "{{`{{ $labels.job }}`}}"
          annotations:
            summary: "Linera {{`{{ $labels.job }}`}} is down on {{`{{ $labels.instance }}`}}"
            description: |
              Prometheus has been unable to scrape {{`{{ $labels.instance }}`}}
              for more than 2 minutes. Either the pod crashed or the
              in-cluster network is broken.

        - alert: LineraShardRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="{{ $ns }}",pod=~".*-shards-.*"}[15m]) > 2
          for: 0m
          labels:
            severity: warning
            component: shard
          annotations:
            summary: "Shard {{`{{ $labels.pod }}`}} restarted > 2 times in 15m"
            description: |
              A shard pod restarted more than twice in the last 15
              minutes. Single restarts are harmless, repeated ones
              indicate a deeper problem.

        - alert: LineraProxyHighLatency
          expr: |
            histogram_quantile(
              0.99,
              rate(linera_proxy_grpc_duration_seconds_bucket{namespace="{{ $ns }}"}[5m])
            ) > 2
          for: 10m
          labels:
            severity: warning
            component: proxy
          annotations:
            summary: "Proxy p99 gRPC latency > 2s"
            description: |
              The proxy's p99 gRPC latency has exceeded 2 seconds for
              10 minutes. Clients are likely seeing degraded response
              times.

    {{- if .Values.prometheusRule.alerts.validatorLatency }}
    # ===================================================================
    # Validator request latency (linera_*_request_latency, milliseconds).
    # Adapted from the GKE infra alerts; scoped to this chart's
    # shard/proxy jobs and release namespace.
    # ===================================================================
    - name: linera-validator.latency
      rules:
        - alert: LineraProxyRequestLatencyHigh
          expr: |
            histogram_quantile(0.99,
              sum by (le, validator, pod) (
                rate(
                  linera_proxy_request_latency_bucket{
                    job=~"linera-shards|linera-proxy", namespace="{{ $ns }}"
                  }[5m]
                )
              )
            ) > 1000
          for: 3m
          labels:
            severity: warning
            component: proxy
          annotations:
            summary: "Proxy {{`{{ $labels.pod }}`}} request p99 > 1s"
            description: |
              Linera proxy request latency p99 exceeds 1 second
              (validator {{`{{ $labels.validator }}`}}).

        - alert: LineraServerRequestLatencyHigh
          expr: |
            histogram_quantile(0.99,
              sum by (le, validator, pod) (
                rate(
                  linera_server_request_latency_bucket{
                    job=~"linera-shards|linera-proxy", namespace="{{ $ns }}"
                  }[5m]
                )
              )
            ) > 1000
          for: 3m
          labels:
            severity: warning
            component: shard
          annotations:
            summary: "Server {{`{{ $labels.pod }}`}} request p99 > 1s"
            description: |
              Linera server request latency p99 exceeds 1 second
              (validator {{`{{ $labels.validator }}`}}).
    {{- end }}

    {{- if .Values.prometheusRule.alerts.chainCorrectness }}
    # ===================================================================
    # Chain correctness. linera_server_request_error counts internal
    # chain errors by error_type; these signal on-disk state corruption
    # that needs manual intervention and cannot self-heal.
    # ===================================================================
    - name: linera-validator.chain
      rules:
        - alert: LineraInboxGapOnChain
          expr: |
            sum by (validator) (
              rate(
                linera_server_request_error{
                  job=~"linera-shards|linera-proxy",
                  error_type="ChainError::InboxGapDetected"
                }[5m]
              )
            ) > 0
          for: 2m
          labels:
            severity: critical
            component: shard
          annotations:
            summary: "[{{`{{ $labels.validator }}`}}] Inbox gap — chain corruption"
            description: |
              Validator {{`{{ $labels.validator }}`}} is returning
              InboxGapDetected errors. A cross-chain inbox is stuck
              and cannot self-heal without manual intervention.

        - alert: LineraCorruptedChainState
          expr: |
            sum by (validator) (
              rate(
                linera_server_request_error{
                  job=~"linera-shards|linera-proxy",
                  error_type="ChainError::CorruptedChainState"
                }[5m]
              )
            ) > 0
          for: 2m
          keep_firing_for: 24h
          labels:
            severity: critical
            component: shard
          annotations:
            summary: "[{{`{{ $labels.validator }}`}}] Corrupted chain state"
            description: |
              Validator {{`{{ $labels.validator }}`}} is returning
              CorruptedChainState errors. A chain's persisted state is
              internally inconsistent and cannot process new blocks
              until reset or repaired.
    {{- end }}

    {{- if .Values.prometheusRule.alerts.blockProduction }}
    # ===================================================================
    # Block production. linera_num_blocks is a per-pod counter of blocks
    # executed; if it stops climbing while the validator is up, the
    # validator has stopped making progress.
    # ===================================================================
    - name: linera-validator.block-production
      rules:
        - alert: LineraBlockExecutionStopped
          expr: |
            increase(
              linera_num_blocks{
                job=~"linera-shards", namespace="{{ $ns }}"
              }[10m]
            ) == 0
          for: 5m
          labels:
            severity: critical
            component: shard
          annotations:
            summary: "Shard {{`{{ $labels.pod }}`}} stopped executing blocks"
            description: |
              linera_num_blocks has not increased in 15+ minutes on
              {{`{{ $labels.pod }}`}} while the shard is up. The
              validator may be wedged — check shard logs and the
              storage backend.
    {{- end }}

    {{- if .Values.prometheusRule.alerts.scylla }}
    # ===================================================================
    # ScyllaDB (storage backend). Native scylla_* metrics scraped from
    # your own Scylla cluster. Latency buckets are in microseconds (μs).
    # No namespace selector: the operator scrapes Scylla wherever it
    # runs. Empty inputs simply never fire.
    # ===================================================================
    - name: linera-validator.scylla
      rules:
        - alert: LineraScyllaReadLatencyHigh
          expr: |
            histogram_quantile(0.99,
              sum by (le, cluster, instance) (
                rate(scylla_storage_proxy_coordinator_read_latency_bucket[5m])
              )
            ) > 100000
          for: 10m
          labels:
            severity: warning
            component: scylla
          annotations:
            summary: "[{{`{{ $labels.cluster }}`}}] ScyllaDB read p99 > 100ms"
            description: |
              Native ScyllaDB coordinator read latency p99 exceeds
              100ms on {{`{{ $labels.instance }}`}}.

        - alert: LineraScyllaWriteLatencyHigh
          expr: |
            histogram_quantile(0.99,
              sum by (le, cluster, instance) (
                rate(scylla_storage_proxy_coordinator_write_latency_bucket[5m])
              )
            ) > 100000
          for: 3m
          labels:
            severity: warning
            component: scylla
          annotations:
            summary: "[{{`{{ $labels.cluster }}`}}] ScyllaDB write p99 > 100ms"
            description: |
              Native ScyllaDB coordinator write latency p99 exceeds
              100ms on {{`{{ $labels.instance }}`}}.

        - alert: LineraScyllaIODelay
          expr: |
            max by (cluster, instance) (scylla_io_queue_delay) > 1000
          for: 3m
          labels:
            severity: warning
            component: scylla
          annotations:
            summary: "[{{`{{ $labels.cluster }}`}}] ScyllaDB I/O delay > 1ms"
            description: |
              I/O scheduler delay exceeds 1ms on
              {{`{{ $labels.instance }}`}}. Disk I/O is congested.

        - alert: LineraScyllaDown
          expr: |
            up{job=~".*scylla.*"} == 0
          for: 2m
          labels:
            severity: critical
            component: scylla
          annotations:
            summary: "ScyllaDB target {{`{{ $labels.instance }}`}} is down"
            description: |
              Prometheus cannot scrape a ScyllaDB target for 2+
              minutes. The validator's storage backend may be
              unavailable.

        - alert: LineraScyllaProcessRestarted
          expr: |
            increase(scylla_uptime_ms[5m]) < 0
          for: 0m
          labels:
            severity: warning
            component: scylla
          annotations:
            summary: "[{{`{{ $labels.cluster }}`}}] ScyllaDB process restarted"
            description: |
              Scylla uptime reset on {{`{{ $labels.instance }}`}},
              indicating the Scylla process restarted. Check memory
              pressure and node OOM events.
    {{- end }}

    {{- if .Values.prometheusRule.alerts.scyllaBackup }}
    # ===================================================================
    # Scylla Manager backups. Only meaningful if you run Scylla Manager
    # against your cluster; off by default. Per-instance (the manager
    # pod) to dodge the manager's UUID-in-cluster label clobber.
    # ===================================================================
    - name: linera-validator.scylla-backup
      rules:
        - alert: LineraScyllaBackupOverdue
          expr: |
            (time() - process_start_time_seconds{job=~".*scylla.?manager.*"}) > 26 * 3600
            unless on (instance)
            (
              time() - scylla_manager_scheduler_last_success{type="backup"}
            ) < 26 * 3600
          for: 15m
          labels:
            severity: critical
            component: scylla
          annotations:
            summary: "No successful Scylla backup for 26h+"
            description: |
              Scylla Manager has been up for 26h+ without a successful
              backup. The newest restore point is going stale. Check
              `sctool tasks` / `sctool progress`.

        - alert: LineraScyllaBackupFailed
          expr: |
            sum by (instance) (
              increase(
                scylla_manager_scheduler_run_total{
                  type="backup", status="ERROR"
                }[6h]
              )
            ) > 0
          for: 0m
          labels:
            severity: warning
            component: scylla
          annotations:
            summary: "Scylla Manager backup run failed"
            description: |
              A scheduled Scylla backup run finished with status ERROR
              in the last 6h. Check `sctool tasks` and the Scylla
              Manager logs (object-store permissions, agent
              connectivity, disk space).
    {{- end }}

    {{- if .Values.prometheusRule.alerts.storage }}
    # ===================================================================
    # Storage capacity. Generic kubelet/node-exporter signals; require
    # kube-state-metrics + node-exporter scraped into your Prometheus.
    # ===================================================================
    - name: linera-validator.storage
      rules:
        - alert: LineraPVCSpaceCritical
          expr: |
            (
              kubelet_volume_stats_available_bytes{namespace="{{ $ns }}"}
              / kubelet_volume_stats_capacity_bytes{namespace="{{ $ns }}"}
            ) * 100 < 15
          for: 2m
          labels:
            severity: critical
            component: storage
          annotations:
            summary: "PVC {{`{{ $labels.persistentvolumeclaim }}`}} < 15% free"
            description: |
              Expand the PVC or clean up data before the service
              crashes.

        - alert: LineraPVCSpaceWarning
          expr: |
            (
              kubelet_volume_stats_available_bytes{namespace="{{ $ns }}"}
              / kubelet_volume_stats_capacity_bytes{namespace="{{ $ns }}"}
            ) * 100 < 30
          for: 10m
          labels:
            severity: warning
            component: storage
          annotations:
            summary: "PVC {{`{{ $labels.persistentvolumeclaim }}`}} < 30% free"
            description: |
              The PVC is filling up. Plan an expansion before it
              becomes critical.

        - alert: LineraPVCFillingUp
          expr: |
            (
              kubelet_volume_stats_available_bytes{namespace="{{ $ns }}"}
              / kubelet_volume_stats_capacity_bytes{namespace="{{ $ns }}"}
            ) * 100 < 30
            and
            predict_linear(
              kubelet_volume_stats_available_bytes{namespace="{{ $ns }}"}[6h],
              24 * 3600
            ) < 0
          for: 1h
          labels:
            severity: warning
            component: storage
          annotations:
            summary: "PVC {{`{{ $labels.persistentvolumeclaim }}`}} will fill within 24h"
            description: |
              Linear prediction over the last 6 hours says this volume
              will hit 0 bytes free within 24 hours at the current
              write rate. Investigate before it becomes critical.
    {{- end }}

    {{- with .Values.prometheusRule.extraRules }}
    - name: linera-validator-extra
      rules:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
