suite: scylla-config
templates:
  - scylla-config.yaml
release:
  name: rel
tests:
  - it: renders ConfigMap when scylla and scylla.config.create are enabled (default)
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: scylla-config

  - it: skips ConfigMap when scylla disabled
    set:
      scylla.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: skips ConfigMap when scylla.config.create is false
    set:
      scylla.config.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: emits arbitrary scylla.yaml keys from values
    set:
      scylla.config.data:
        endpoint_snitch: GossipingPropertyFileSnitch
        cluster_name: linera-test
    asserts:
      - matchRegex:
          path: data["scylla.yaml"]
          pattern: "endpoint_snitch: GossipingPropertyFileSnitch"
      - matchRegex:
          path: data["scylla.yaml"]
          pattern: "cluster_name: linera-test"

  - it: defaults to durable batch commitlog with a 2ms window
    asserts:
      - matchRegex:
          path: data["scylla.yaml"]
          pattern: "commitlog_sync: batch"
      - matchRegex:
          path: data["scylla.yaml"]
          pattern: "commitlog_sync_batch_window_in_ms: 2"

  - it: honours a custom batch window
    set:
      scylla.config.commitlogSyncBatchWindowMs: 5
    asserts:
      - matchRegex:
          path: data["scylla.yaml"]
          pattern: "commitlog_sync_batch_window_in_ms: 5"

  - it: periodic commitlog omits the batch window key
    set:
      scylla.config.commitlogSync: periodic
    asserts:
      - matchRegex:
          path: data["scylla.yaml"]
          pattern: "commitlog_sync: periodic"
      - notMatchRegex:
          path: data["scylla.yaml"]
          pattern: "commitlog_sync_batch_window_in_ms"

  - it: omits commitlog_sync entirely when commitlogSync is empty
    set:
      scylla.config.commitlogSync: ""
    asserts:
      - notMatchRegex:
          path: data["scylla.yaml"]
          pattern: "commitlog_sync"
