{{- if and .Values.scylla.enabled .Values.scylla.config.create -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: scylla-config
  namespace: {{ .Values.scylla.namespace | quote }}
  labels:
    {{- include "linera-validator-stack.labels" . | nindent 4 }}
data:
  scylla.yaml: |
    {{- range $key, $value := .Values.scylla.config.data }}
    {{ $key }}: {{ $value }}
    {{- end }}
    {{- with .Values.scylla.config.commitlogSync }}
    commitlog_sync: {{ . }}
    {{- end }}
    {{- if eq (.Values.scylla.config.commitlogSync | toString) "batch" }}
    commitlog_sync_batch_window_in_ms: {{ .Values.scylla.config.commitlogSyncBatchWindowMs | int }}
    {{- end }}
{{- end -}}
