{{- if .Values.scylla.enabled -}}
apiVersion: scylla.scylladb.com/v1
kind: ScyllaCluster
metadata:
  name: {{ .Values.scylla.name | quote }}
  namespace: {{ .Values.scylla.namespace | quote }}
  annotations:
    # Applied BEFORE the shards and proxy StatefulSets, which are wave 0.
    #
    # Not a preference — it is what stops a transient failure here from
    # deadlocking the whole sync. Those StatefulSets run a storage-init
    # container that loops until this cluster answers CQL, so in a shared wave
    # ArgoCD waits for them to be healthy, they wait for a ScyllaCluster that
    # failed to apply, and the wave can never complete. The operation then
    # never finishes, so it is never retried AND a manual `argocd app sync` is
    # refused with "another operation is already in progress" until someone
    # runs terminate-op.
    #
    # The trigger is a startup race, which is why it is intermittent: the
    # scylla-operator's admission webhook can still have no endpoints when this
    # is applied, and the apply fails with `failed calling webhook
    # "webhook.scylla.scylladb.com"`. In an earlier wave the same failure is
    # harmless — nothing exists yet that could block the wave's health, so
    # ArgoCD simply retries until the webhook is serving.
    #
    # Same wave as the namespace this lives in; ArgoCD orders Namespace ahead
    # of custom resources within a wave.
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "linera-validator-stack.labels" . | nindent 4 }}
spec:
  version: {{ .Values.scylla.scyllaVersion | quote }}
  repository: {{ .Values.scylla.scyllaImage | quote }}
  agentVersion: {{ .Values.scylla.agentVersion | quote }}
  agentRepository: {{ .Values.scylla.agentImage | quote }}
  {{- if .Values.scylla.developerMode }}
  developerMode: true
  {{- end }}
  {{- with .Values.scylla.sysctls }}
  sysctls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  datacenter:
    name: {{ .Values.scylla.datacenter | quote }}
    racks:
      - name: {{ .Values.scylla.rack.name | quote }}
        members: {{ .Values.scylla.rack.members }}
        scyllaConfig: scylla-config
        storage:
          capacity: {{ .Values.scylla.rack.storage.capacity | quote }}
          {{- with .Values.scylla.rack.storage.storageClassName }}
          storageClassName: {{ . | quote }}
          {{- end }}
        {{- with .Values.scylla.rack.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.scylla.rack.agentResources }}
        # requests==limits here + integer-cpu resources above => Guaranteed QoS
        # for the whole pod, so the static CPU manager can pin Scylla's cores.
        agentResources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if or .Values.scylla.rack.placement.nodeAffinity .Values.scylla.rack.placement.tolerations }}
        placement:
          {{- with .Values.scylla.rack.placement.nodeAffinity }}
          nodeAffinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.scylla.rack.placement.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
  {{- if .Values.scylla.backups.enabled }}
  backups:
    - name: {{ .Values.scylla.backups.name | quote }}
      cron: {{ .Values.scylla.backups.cron | quote }}
      keyspace:
        {{- range .Values.scylla.backups.keyspaces }}
        - {{ . | quote }}
        {{- end }}
      location:
        - {{ required ".Values.scylla.backups.location is required when backups.enabled is true" .Values.scylla.backups.location | quote }}
      rateLimit:
        {{- range .Values.scylla.backups.rateLimit }}
        - {{ . | quote }}
        {{- end }}
      retention: {{ .Values.scylla.backups.retentionDays }}
      numRetries: {{ .Values.scylla.backups.numRetries }}
  {{- end }}
{{- end -}}
