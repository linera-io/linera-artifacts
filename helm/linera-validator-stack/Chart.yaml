apiVersion: v2
name: linera-validator-stack
description: |
  Umbrella chart that installs everything needed to run a Linera
  validator in one shot: the validator (shards + proxies), an optional
  block exporter, and a ScyllaCluster CR for the storage backend.

  The chart depends on linera-validator and linera-block-exporter from
  this same repository. Each sub-chart is opt-in via its
  `<name>.enabled` value (validator on by default; the block exporter
  off).

  Prerequisite operators that must already be installed in the cluster:
    - scylla-operator   (for the ScyllaCluster CR)
type: application

version: 0.1.4
appVersion: "0.13.0"

home: https://linera.io
sources:
  - https://github.com/linera-io/linera-artifacts
  - https://github.com/linera-io/linera-protocol
icon: https://raw.githubusercontent.com/linera-io/linera-artifacts/main/assets/linera-logo.svg
keywords:
  - linera
  - blockchain
  - validator
  - umbrella
  - web3
maintainers:
  - name: Linera infrastructure team
    url: https://github.com/linera-io
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/operator: "false"
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/linera-io/linera-artifacts
    - name: Linera protocol
      url: https://github.com/linera-io/linera-protocol
  artifacthub.io/changes: |
    - kind: added
      description: Initial release of the umbrella chart.

dependencies:
  - name: linera-validator
    version: 0.1.3
    repository: file://../linera-validator
    condition: linera-validator.enabled
  - name: linera-block-exporter
    version: 0.1.3
    repository: file://../linera-block-exporter
    condition: linera-block-exporter.enabled
