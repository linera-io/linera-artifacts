global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.rules.yaml
  # Backs docker/dashboards/performance.json. Without this the Execution,
  # Request and Storage latency panels have nothing to read.
  - /etc/prometheus/recording.rules.yaml

# Job names and the `shard` label match alloy-config.river exactly, so the
# dashboards work whichever of the two scrape paths you run. `shard` is not
# emitted by the binaries — both paths relabel it from each shard container's
# linera.shard label, and the per-shard panels group by it.
scrape_configs:
  # Alloy's own metrics (exposes a "targets" page at :12345).
  - job_name: 'alloy'
    static_configs:
      - targets: ['alloy:12345']

  # cAdvisor — per-container CPU/mem/io.
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Linera proxy.
  - job_name: 'linera-proxy'
    static_configs:
      - targets: ['proxy:21100']

  # ScyllaDB. With docker-compose.remote-scylla.yaml the `scylla` name is
  # repointed via extra_hosts for the validator services only, so a remote
  # deployment must set this target to SCYLLA_HOST or ScyllaDown misfires.
  - job_name: 'scylla'
    static_configs:
      - targets: ['scylla:9180']

  # Linera shards, discovered from the Docker daemon so the shard count is
  # configurable without editing this file. A static list would alert on the
  # shards a smaller deployment does not run.
  - job_name: 'linera-shard'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        port: 21100
    relabel_configs:
      # Every shard service carries linera.shard; nothing else does.
      - source_labels: [__meta_docker_container_label_linera_shard]
        regex: .+
        action: keep
      # The image declares no EXPOSE, so `port` above already yields one
      # target per container. Pin the address anyway: an EXPOSE added
      # upstream would otherwise produce a target per exposed port.
      - source_labels: [__meta_docker_network_ip]
        target_label: __address__
        replacement: '$1:21100'
      - source_labels: [__meta_docker_container_label_linera_shard]
        target_label: shard
