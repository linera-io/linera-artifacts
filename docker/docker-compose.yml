  # any container labelled `com.centurylinklabs.watchtower.enable=true`.
  # ---------------------------------------------------------------------------
  watchtower:
    image: ${WATCHTOWER_IMAGE:-nickfedor/watchtower:1.15.0}
    container_name: watchtower
    restart: unless-stopped
    logging: *default-logging
    cpuset: "${WORKLOAD_CPUSET:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["--interval", "${WATCHTOWER_INTERVAL:-30}"]
    deploy:
      resources:
        limits:
          cpus: "${LIMIT_CPUS_WATCHTOWER:-0.25}"
          memory: ${LIMIT_MEM_WATCHTOWER:-256M}

# All durable state is bind-mounted so backups use your usual file-level
# tooling (rsync, borgmatic, snapshots, etc.). Each service has its own
# env var so you can put the heavy ones on dedicated disks:
#
#   SCYLLA_DATA_DIR         default ./data/scylla
#   CADDY_DATA_DIR          default ./data/caddy-data
#   CADDY_CONFIG_DIR        default ./data/caddy-config
#   (observability overlays add PROMETHEUS_DATA_DIR, GRAFANA_DATA_DIR,
#    LOKI_DATA_DIR, TEMPO_DATA_DIR, ALLOY_DATA_DIR)
#
# Override in .env to point at a dedicated disk, e.g.
# SCYLLA_DATA_DIR=/mnt/scylla-ssd. docker compose creates the
# directory on first start if it doesn't exist.
