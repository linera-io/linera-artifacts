# =============================================================================
# linera-validator — docker compose
# =============================================================================
#
# Single-validator stack for operators who want to run a Linera validator
# on a dedicated host (VM or bare metal) and join an existing network.
#
# Runs: Caddy (TLS) -> linera-proxy -> N linera-server shards -> ScyllaDB.
# Also runs Watchtower for label-driven auto-updates and a one-shot
# scylla-setup container that tunes host sysctls for ScyllaDB.
#
# Usage:
#   1. cp .env.production.template .env
#   2. Fill in DOMAIN, ACME_EMAIL, VALIDATOR_NAME, VALIDATOR_KEY, and
#      (if different) GENESIS_URL.
#   3. Put your server.json (contains the signing key) and
#      genesis.json in this directory.
#   4. docker compose up -d
#
# The scripts/deploy-validator.sh helper automates steps 1-4 for
# new deployments. See docs/DOCKER-COMPOSE.md for the full reference.
#
# Optional overlays (layered with `-f`):
#   docker-compose.observability-push.yml  → Grafana Alloy pushing
#                                            metrics/logs/traces to a
#                                            remote backend
#   docker-compose.observability-local.yml → Prometheus + Grafana +
#                                            Loki + Tempo running on
#                                            the same host
# =============================================================================

# Default logging policy applied to every service via YAML anchor.
# Caps each container's json-file log at ~500 MB total (5 × 100 MB) so a
# misbehaving service can't fill the host disk. Without rotation, a
# verbose container can grow a single json-file log into hundreds of GB
# in days, OOM-style filling the root disk and taking the whole stack
# down via OCI runtime errors.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"
    compress: "true"

services:

  # ---------------------------------------------------------------------------
  # Caddy — TLS terminator + gRPC reverse proxy.
  # Obtains Let's Encrypt certificates for $DOMAIN automatically.
  # ---------------------------------------------------------------------------
  web:
    image: ${CADDY_IMAGE:-caddy:2.10.2-alpine}
    container_name: web
    restart: unless-stopped
    logging: *default-logging
    # Complementary half of SCYLLA_CPUSET: every non-Scylla service is pinned
    # to WORKLOAD_CPUSET so nothing gets scheduled onto ScyllaDB's cores.
    # Empty (default) = no pinning. See "Dedicated-hardware ScyllaDB tuning"
    # in docs/DOCKER-COMPOSE.md.
    cpuset: "${WORKLOAD_CPUSET:-}"
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_DIR:-./data/caddy-data}:/data
      - ${CADDY_CONFIG_DIR:-./data/caddy-config}:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ulimits:
      nofile:
        soft: ${ULIMIT_NOFILE:-524288}
        hard: ${ULIMIT_NOFILE:-524288}
    deploy:
      resources:
        limits:
          cpus: "${LIMIT_CPUS_WEB:-1.00}"
          memory: ${LIMIT_MEM_WEB:-3G}

  # ---------------------------------------------------------------------------
  # scylla-setup — one-shot privileged container that tunes host-side
  # sysctls (fs.aio-max-nr, etc.) ScyllaDB needs to start. Persists the
  # settings to /etc/sysctl.d/99-scylladb.conf.
  # ---------------------------------------------------------------------------
  scylla-setup:
    image: ubuntu:24.04
    container_name: scylla-setup
    privileged: true
    logging: *default-logging
    volumes:
      - /proc:/host/proc
      - /sys:/host/sys
      - /etc/sysctl.d:/host/sysctl.d
      - ./scylla-setup.sh:/setup.sh:ro
    command: ["/bin/bash", "/setup.sh", "--persist"]
    restart: "no"

  # ---------------------------------------------------------------------------
  # ScyllaDB — durable storage backend.
  # ---------------------------------------------------------------------------
  scylla:
    image: ${SCYLLA_IMAGE:-scylladb/scylla:6.2.3}
    container_name: scylla
    restart: unless-stopped
    logging: *default-logging
    # Optional CPU pinning for dedicated hardware. Empty (default) = no
    # pinning, matching the shared-host case. Set SCYLLA_CPUSET (logical CPU
    # numbers, e.g. "0-11") in .env to confine ScyllaDB to its own cores so it
    # never contends with the shards/proxy — the docker mirror of the GKE
    # validators' dedicated-node perftune CPU pinning. Pair it with
    # SCYLLA_OVERPROVISIONED=0 and WORKLOAD_CPUSET (the complementary set on
    # every other service) — without WORKLOAD_CPUSET the kernel can still
    # schedule the shards onto ScyllaDB's cores and the isolation is
    # one-sided.
    cpuset: "${SCYLLA_CPUSET:-}"
    volumes:
      - ${SCYLLA_DATA_DIR:-./data/scylla}:/var/lib/scylla
    environment:
      SCYLLA_AUTO_CONF: 1
    command:
      - "--developer-mode"
      - "${SCYLLA_DEVELOPER_MODE:-0}"
      - "--overprovisioned"
      - "${SCYLLA_OVERPROVISIONED:-1}"
      # Durability: batch commitlog sync, mirroring the testnet-conway GKE
      # validators (argo/app-values/validator/base-values.yaml:
      # scyllaCommitlogSync=batch, window=2ms). Scylla accepts config keys as
      # CLI flags (underscores -> dashes); these are appended verbatim to the
      # scylla binary via the image's SCYLLA_DOCKER_ARGS passthrough.
      - "--commitlog-sync"
      - "${SCYLLA_COMMITLOG_SYNC:-batch}"
      - "--commitlog-sync-batch-window-in-ms"
      - "${SCYLLA_COMMITLOG_SYNC_BATCH_WINDOW_MS:-2}"
      # Bind ScyllaDB shard count to the CPU budget from the cgroup limits
      # below. Without --smp, ScyllaDB auto-detects shards from the
      # container's visible nproc (= host nproc) and divides memory across
      # them, which fails on 32+ core hosts because per-shard memory drops
      # below the 1 GiB floor.
      # WARNING: --smp can only be INCREASED on existing data. Reducing it
      # requires wiping the scylla volume and re-syncing from genesis.
      - "--smp"
      - "${SCYLLA_SMP:-${LIMIT_CPUS_SCYLLA:-4}}"
      # NOTE: --memory is intentionally NOT set. ScyllaDB reads the cgroup
      # memory limit (LIMIT_MEM_SCYLLA below) and, with --overprovisioned 1,
      # reserves its own ~7-10% headroom for OS buffers and non-shard
      # overhead. Setting --memory equal to the cgroup limit overrides that
      # safety margin and causes "not enough memory" crashes.
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: ${SCYLLA_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${SCYLLA_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${SCYLLA_HEALTHCHECK_RETRIES:-20}
      start_period: ${SCYLLA_HEALTHCHECK_START_PERIOD:-60s}
    depends_on:
      scylla-setup:
        condition: service_completed_successfully
    ulimits:
      nofile:
        soft: ${ULIMIT_NOFILE:-524288}
        hard: ${ULIMIT_NOFILE:-524288}
    deploy:
      resources:
        limits:
          cpus: "${LIMIT_CPUS_SCYLLA:-4.00}"
          memory: ${LIMIT_MEM_SCYLLA:-30G}

  # ---------------------------------------------------------------------------
  # shard-init — one-shot: initialize the validator's database from
  # genesis.json if it doesn't exist yet.
  # ---------------------------------------------------------------------------
  shard-init:
    image: >-
      ${LINERA_IMAGE:-us-docker.pkg.dev/linera-io-dev/linera-public-registry/linera:testnet_conway_release}
    container_name: shard-init
    logging: *default-logging
    environment:
      - SCYLLA_PORT=${SCYLLA_PORT:-9042}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        while true; do
          status=0
          /linera storage check-existence --storage scylladb:tcp:scylla:$$SCYLLA_PORT || status=$$?
          case "$$status" in
            0)
              echo "Database already exists, no need to initialize."
              exit 0
              ;;
            1)
              echo "Database does not exist, attempting to initialize..."
              if /linera storage initialize \
                   --storage scylladb:tcp:scylla:$$SCYLLA_PORT \
                   --genesis /config/genesis.json; then
                echo "Initialization successful."
                exit 0
              fi
              echo "Initialization failed, retrying in 5 seconds..."
              sleep 5
              ;;
            *)
              echo "Unexpected status $$status, retrying in 5 seconds..."
              sleep 5
              ;;
          esac
        done
    volumes:
      - .:/config
    depends_on:
      scylla:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # proxy — single-replica linera-proxy. Caddy forwards external traffic here.
  # ---------------------------------------------------------------------------
  proxy:
    image: >-
      ${LINERA_IMAGE:-us-docker.pkg.dev/linera-io-dev/linera-public-registry/linera:testnet_conway_release}
    container_name: proxy
    restart: unless-stopped
    logging: *default-logging
    cpuset: "${WORKLOAD_CPUSET:-}"
    ports:
      - "${PROXY_PORT:-19100}:19100"
    command:
      - /linera-proxy
      - --storage
      - scylladb:tcp:scylla:${SCYLLA_PORT:-9042}
      - --storage-replication-factor
      - "${STORAGE_REPLICATION_FACTOR:-1}"
      # Storage (LRU) caches — parity with the k8s chart's proxies.cli.
      - --storage-max-cache-size
      - "${LINERA_STORAGE_MAX_CACHE_SIZE:-1000000000}"
      - --storage-max-cache-entries
      - "${LINERA_STORAGE_MAX_CACHE_ENTRIES:-500000}"
      - --storage-max-value-entry-size
      - "${LINERA_STORAGE_MAX_VALUE_ENTRY_SIZE:-1000000}"
      - --storage-max-find-keys-entry-size
      - "${LINERA_STORAGE_MAX_FIND_KEYS_ENTRY_SIZE:-1000000}"
      - --storage-max-find-key-values-entry-size
      - "${LINERA_STORAGE_MAX_FIND_KEY_VALUES_ENTRY_SIZE:-1000000}"
      - --storage-max-cache-value-size
      - "${LINERA_STORAGE_MAX_CACHE_VALUE_SIZE:-500000000}"
      - --storage-max-cache-find-keys-size
      - "${LINERA_STORAGE_MAX_CACHE_FIND_KEYS_SIZE:-200000000}"
      - --storage-max-cache-find-key-values-size
      - "${LINERA_STORAGE_MAX_CACHE_FIND_KEY_VALUES_SIZE:-10000000}"
      # In-memory caches — parity with the k8s chart's proxies.cli. The proxy
      # does not execute blocks, so block/execution-state/chain-worker flags
      # are shard-only and intentionally omitted here.
      - --blob-cache-size
      - "${LINERA_BLOB_CACHE_SIZE:-1000}"
      - --confirmed-block-cache-size
      - "${LINERA_CONFIRMED_BLOCK_CACHE_SIZE:-10000}"
      - --certificate-cache-size
      - "${LINERA_CERTIFICATE_CACHE_SIZE:-5000}"
      - --certificate-raw-cache-size
      - "${LINERA_CERTIFICATE_RAW_CACHE_SIZE:-50000}"
      - --event-cache-size
      - "${LINERA_EVENT_CACHE_SIZE:-20000}"
      - /config/server.json
    volumes:
      - .:/config
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/21100' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      shard-init:
        condition: service_completed_successfully
      scylla:
        condition: service_healthy
    ulimits:
      nofile:
        soft: ${ULIMIT_NOFILE:-524288}
        hard: ${ULIMIT_NOFILE:-524288}
    deploy:
      resources:
        limits:
          cpus: "${LIMIT_CPUS_PROXY:-1.50}"
          memory: ${LIMIT_MEM_PROXY:-4G}

  # ---------------------------------------------------------------------------
  # Shards — one container per shard. Each shard must run with a unique
  # --shard number matching the [[shards]] list in server.json.
  # Docker Compose replicas don't support per-replica arguments, so we
